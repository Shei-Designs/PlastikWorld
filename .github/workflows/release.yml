# Builds installers for Linux, Windows and macOS and attaches them to a draft
# GitHub release. Runs when a version tag (v1.2.3) is pushed, or manually from
# the Actions tab. Publish the draft on GitHub once the builds look right.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # One job creates the draft so the platform builds don't race to create it.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the app version
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Find or create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="PlastikCAD World Builder $TAG" \
              -F body=@.github/release-notes.md \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: ''
          - name: Windows
            platform: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
