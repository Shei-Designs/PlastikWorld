[package]
name = "plastikworld"
version = "0.1.0"
description = "Build worlds for robot simulation: place PlastikCAD objects and robots, write the scene for Gazebo, MuJoCo and Isaac Sim"
authors = ["Andrew O'Shei"]
license = "GPL-3.0-or-later"
homepage = "https://sheidesigns.com"
repository = "https://github.com/Shei-Designs/PlastikWorld"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plastikworld_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Used from Rust only, so that files picked on Android (content:// URIs) can be read and written.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Elevation tiles fetched from the Rust side: the webview's own fetch is refused by buckets that send no CORS headers.
tauri-plugin-http = "2"
# Android: the keyboard and keypad the app is driven with, the documents the pickers hand out, exports to Downloads, the share sheet. PlastikCAD's, lifted.
tauri-plugin-device = { path = "plugins/device" }
serde = { version = "1", features = ["derive"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
